<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>citasIA MVP</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      input, textarea, button { width: 100%; margin-top: .5rem; padding: .6rem; }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>citasIA (MVP skeleton)</h1>

    <div class="card">
      <h2>Auth</h2>
      <input placeholder="email" />
      <input placeholder="password" type="password" />
      <button>Login</button>
    </div>

    <div class="card">
      <h2>AI Chat</h2>
      <textarea rows="4" placeholder="Talk with AI to build your psychological profile..."></textarea>
      <button>Send to AI</button>
    </div>

    <div class="card">
      <h2>Matches</h2>
      <p>Top compatibility list will be rendered here.</p>
    </div>
  </body>
</html>
